<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Roster</title>
<style>
:root {
  --bg: #f5f4f0;
  --card: #ffffff;
  --ink: #17171a;
  --muted: #6b6b73;
  --line: #e4e2dc;
  --accent: #17171a;
  --avail: #1f7a5a;
  --avail-bg: #e3f3ec;
  --booked: #2c5fb3;
  --booked-bg: #e4ecfa;
  --no: #8b8b93;
  --no-bg: #f0efeb;
  --warn: #b42318;
  --warn-bg: #fdecea;
  --gold: #b8913a;
  --radius: 12px;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--booked); }
.hidden { display: none !important; }

header.top { background: var(--ink); color: #fff; position: sticky; top: 0; z-index: 20; }
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; max-width: 1200px; margin: 0 auto; }
.brand { font-weight: 700; letter-spacing: .2px; }
.brand small { display: block; font-weight: 400; color: #bdbdc4; font-size: 12px; }
.who { font-size: 13px; color: #d6d6dc; text-align: right; }
nav.tabs { display: flex; gap: 4px; overflow-x: auto; padding: 0 12px 10px; max-width: 1200px; margin: 0 auto; scrollbar-width: none; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs button { background: transparent; border: 0; color: #c9c9cf; padding: 7px 12px; border-radius: 999px; white-space: nowrap; cursor: pointer; }
nav.tabs button.on { background: #fff; color: var(--ink); font-weight: 600; }

main { max-width: 1200px; margin: 0 auto; padding: 16px 16px 120px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
h1 { font-size: 20px; margin: 4px 0 6px; }
h2 { font-size: 16px; margin: 0 0 10px; }
.sub { color: var(--muted); font-size: 13px; margin: 0 0 14px; }

.auth-wrap { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
.auth { width: 100%; max-width: 380px; }
.auth .logo { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 4px; }
input[type=email], input[type=password], input[type=text], select {
  width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
input:focus, select:focus, button:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 16px; border-radius: 10px;
  border: 1px solid var(--ink); background: var(--ink); color: #fff; font-weight: 600; cursor: pointer; }
.btn.ghost { background: #fff; color: var(--ink); border-color: var(--line); }
.btn.small { padding: 6px 10px; font-size: 13px; border-radius: 8px; }
.btn.block { width: 100%; margin-top: 16px; }
.btn:disabled { opacity: .5; cursor: default; }
.linkbtn { background: none; border: 0; color: var(--booked); padding: 0; cursor: pointer; font-size: 13px; }
.msg { padding: 10px 12px; border-radius: 10px; font-size: 13px; margin-top: 12px; }
.msg.err { background: var(--warn-bg); color: var(--warn); }
.msg.ok { background: var(--avail-bg); color: var(--avail); }

.week { margin-bottom: 14px; }
.week-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.week-head h2 { margin: 0; }
.quick { display: flex; gap: 6px; flex-wrap: wrap; }
.day { display: grid; grid-template-columns: 92px 1fr; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.day:first-of-type { border-top: 0; }
.day .d { font-weight: 600; font-size: 14px; }
.day .d small { display: block; font-weight: 400; color: var(--muted); font-size: 11px; }
.day.weekend .d { color: var(--gold); }
.slots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; min-width: 0; }
.slot { min-width: 0; border: 1px solid var(--line); background: var(--no-bg); color: var(--no); border-radius: 9px; padding: 9px 4px; text-align: center;
  font-size: 13px; font-weight: 600; cursor: pointer; min-height: 42px; line-height: 1.15; }
.slot.on { background: var(--avail-bg); color: var(--avail); border-color: #9fd3bd; }
.slot.off { background: #ececea; color: #5d5d64; border-color: #d4d2cc; }
.slot.off small { text-decoration: none; }
.slot.unset { background: #fff; color: #9a9aa2; border: 1px dashed #cfcac0; }
.cell.n { background: #c9c7c1; border-color: #c9c7c1; }
.slot.booked { background: var(--booked-bg); color: var(--booked); border-color: #b6c9ef; cursor: default; }
.slot small { display: block; font-weight: 500; font-size: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tag { display: inline-block; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; padding: 2px 6px; border-radius: 6px; }
.tag.unfilled { background: #fff4d6; color: #8a6100; }
.savebar { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
  display: flex; justify-content: space-between; align-items: center; gap: 12px; z-index: 30; box-shadow: 0 -4px 20px rgba(0,0,0,.05); }
.savebar .txt { font-size: 13px; color: var(--muted); }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.toolbar select { width: auto; padding: 7px 10px; }
.chips { display: flex; gap: 6px; overflow-x: auto; }
.chip { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer; white-space: nowrap; }
.chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.gapdot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); vertical-align: middle; margin-left: 2px; }
.gridwrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; }
table.grid { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 760px; font-size: 12px; }
table.grid th, table.grid td { border-bottom: 1px solid var(--line); padding: 6px; text-align: center; }
table.grid th:first-child, table.grid td:first-child { position: sticky; left: 0; background: #fff; text-align: left; z-index: 2; min-width: 130px; border-right: 1px solid var(--line); }
table.grid th { font-weight: 600; background: #faf9f6; }
table.grid th.wk { color: var(--gold); }
.cells { display: flex; gap: 2px; justify-content: center; }
.cell { width: 26px; height: 22px; border-radius: 4px; background: var(--no-bg); border: 1px solid #e2e0da; }
.cell.a { background: var(--avail); border-color: var(--avail); }
.cell.b { background: var(--booked); border-color: var(--booked); }
.cell.x { background: var(--warn); border-color: var(--warn); }
.cell.u { background: repeating-linear-gradient(45deg, #fff, #fff 3px, #efe7cf 3px, #efe7cf 6px); border-color: #e6dcbc; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend .cell { width: 14px; height: 14px; }
button.cell { padding: 0; cursor: pointer; display: inline-block; }
button.cell:hover { outline: 2px solid var(--gold); outline-offset: 1px; }

table.list { width: 100%; border-collapse: collapse; font-size: 14px; }
table.list th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 8px 6px; border-bottom: 1px solid var(--line); }
table.list td { padding: 10px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
.pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; background: var(--no-bg); color: var(--muted); margin: 1px 2px 1px 0; }
.pill.admin { background: #f6edd6; color: #7a5a12; }
.pill.off { background: var(--warn-bg); color: var(--warn); }
.empty { color: var(--muted); padding: 18px 0; text-align: center; }

.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.person { padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.person:last-child { border-bottom: 0; }
.person small { color: var(--muted); display: block; font-size: 12px; }
.col-head { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }

.checks { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 4px; }
.checks label { display: inline-flex; align-items: center; gap: 6px; font-weight: 400; margin: 0; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
@media (max-width: 560px) { .row2 { grid-template-columns: 1fr; } .day { grid-template-columns: 76px 1fr; } }
.job { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 8px; display: grid;
  grid-template-columns: 96px minmax(0, 1fr) auto; gap: 12px; align-items: center; cursor: pointer; }
.job:hover { border-color: #cfccc4; }
.job.open { border: 2px solid var(--ink); border-bottom-left-radius: 0; border-bottom-right-radius: 0; margin-bottom: 0; }
.job .when { font-weight: 600; font-size: 14px; }
.job .when small, .job .meta { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.job .t { font-weight: 600; }
.st { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.st.ok { background: var(--avail-bg); color: var(--avail); }
.st.wa { background: #fff4d6; color: #8a6100; }
.st.dg { background: var(--warn-bg); color: var(--warn); }
.st.mu { background: var(--no-bg); color: var(--muted); }
.alloc { background: #fff; border: 2px solid var(--ink); border-top: 0; border-radius: 0 0 var(--radius) var(--radius); padding: 4px 14px 14px; margin-bottom: 12px; }
.alloc h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin: 14px 0 4px; }
.arow { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
.arow small { color: var(--muted); font-size: 12px; }
.warnline { font-size: 12px; color: #8a6100; margin-top: 3px; }
@media (max-width: 560px) { .job { grid-template-columns: 1fr; gap: 4px; } }
.spinner { position: fixed; inset: 0; background: rgba(245,244,240,.6); display: grid; place-items: center; z-index: 50; }
.spinner div { width: 34px; height: 34px; border: 3px solid var(--line); border-top-color: var(--ink); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 60; }
</style>
</head>
<body>
<div id="root"></div>
<div id="spinner" class="spinner hidden"><div></div></div>
<div id="toast" class="toast hidden"></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
